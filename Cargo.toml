[package]
name = "vlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
description = "Libraries over Vivid 1.5; `vlib::vui` is a declarative UI toolkit over pane overlays"

[features]
# A UI driven headlessly, against the SDK's in-process presenter. Off by default: a shipped
# application has no use for the test presenter.
testing = ["vivid_sdk/testing"]

[dependencies]
# Decoding is the producer's job, not the host's: the protocol carries raw RGBA, and putting an
# untrusted decoder in the terminal would be a decoder in the terminal.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
resvg = { version = "0.48", default-features = false }
taffy = "0.14"
usvg = { version = "0.48", default-features = false }
vivid_protocol = { version = "1.5", path = "../vivid_protocol" }
vivid_sdk = { version = "1.5", path = "../vivid_sdk" }

[dev-dependencies]
vivid_sdk = { version = "1.5", path = "../vivid_sdk", features = ["testing"] }
